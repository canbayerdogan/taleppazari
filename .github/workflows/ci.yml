# Build, format check, tests, dependency review and secret scan (T-009).
#
# Required check for branch protection: "CI result" (the aggregate job at the end).
# Do not rename jobs casually: a renamed job is a new check name and breaks required checks.
# No `paths` / `paths-ignore` filters on purpose: a required check that never starts blocks merging forever.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, build and test only: a new NuGet audit advisory on unchanged code turns this run red.
    - cron: "23 4 * * 1"

# Least privilege by default; no job elevates.
permissions:
  contents: read

# Pull requests: a new push cancels the older run of the same PR.
# main and schedule: never cancelled (the group is unique per commit and event).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # Integration and pagination tests fail instead of skip when Docker is missing.
      TALEPPAZARI_REQUIRE_DOCKER: "true"
      # The runner is discarded after the job, so the Testcontainers cleanup container (ryuk) adds nothing
      # and would be one more Docker Hub pull.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # CI=true is set by GitHub Actions itself. The OpenAPI snapshot update variable is never set in CI.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The repository has no packages.lock.json, so setup-dotnet's built-in cache cannot be used.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TalepPazari.slnx

      # Release: the configuration that ships. Warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build TalepPazari.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format TalepPazari.slnx --verify-no-changes --no-restore

      # Docker Hub can throttle anonymous pulls on shared runners; retry before the tests need the image.
      - name: Pre-pull PostgreSQL image
        run: |
          image="postgis/postgis:18-3.6" # same image as compose.yaml and PostgresFixture
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Pull attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Could not pull $image after 3 attempts."
          exit 1

      - name: Architecture tests
        run: >-
          dotnet test tests/TalepPazari.ArchitectureTests --configuration Release --no-build
          --logger trx --results-directory TestResults/architecture

      - name: Api tests
        run: >-
          dotnet test tests/TalepPazari.ApiTests --configuration Release --no-build
          --logger trx --results-directory TestResults/api

      - name: Integration tests
        run: >-
          dotnet test tests/TalepPazari.IntegrationTests --configuration Release --no-build
          --logger trx --results-directory TestResults/integration

      # Only on failure, short retention. TRX files and the generated OpenAPI document; no configuration or secrets.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            tests/TalepPazari.ApiTests/bin/Release/*/Snapshots/openapi-v1.received.json
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    # Compares the PR's base and head; there is nothing to compare on push or schedule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # A PR comment would need pull-requests: write; the job summary is enough.
          comment-summary-in-pr: never

  secret-scan:
    name: Secret scan
    # The weekly schedule is for build and test only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release; update together with the version.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Full history: a push to main scans all of it; a PR needs its base commit for the commit range.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (pinned, checksum verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # --redact keeps any finding's value out of the log.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1
          --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  ci-result:
    name: CI result
    # Always runs, so the required check reports even when a job before it failed or was skipped.
    if: always()
    needs: [build-test, dependency-review, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          EVENT: ${{ github.event_name }}
          BUILD_TEST: ${{ needs.build-test.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          failed=0

          # check <job name> <result> <whether "skipped" is expected for this event>
          check() {
            if [ "$2" = "success" ] || { [ "$2" = "skipped" ] && [ "$3" = "true" ]; }; then
              echo "$1: $2"
            else
              echo "::error::$1: $2"
              failed=1
            fi
          }

          check "Build and test" "$BUILD_TEST" false
          if [ "$EVENT" = "pull_request" ]; then dr_may_skip=false; else dr_may_skip=true; fi
          check "Dependency review" "$DEPENDENCY_REVIEW" "$dr_may_skip"
          if [ "$EVENT" = "schedule" ]; then ss_may_skip=true; else ss_may_skip=false; fi
          check "Secret scan" "$SECRET_SCAN" "$ss_may_skip"

          exit "$failed"
