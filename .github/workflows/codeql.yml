# CodeQL code scanning for C# (T-009), advanced setup with a manual build.
#
# The repository's CodeQL "default setup" must be disabled (owner setting), otherwise GitHub rejects the
# results uploaded by this workflow.
# Required check for branch protection: "Analyze (csharp)". Do not rename the job casually.
# No `paths` / `paths-ignore` filters on purpose: a required check that never starts blocks merging forever.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new queries in CodeQL releases also run on unchanged code.
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Needed to upload the analysis results to code scanning.
      security-events: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          # Manual: CodeQL observes the real compilation, so the analysis sees exactly what ships.
          build-mode: manual

      - name: Build
        run: dotnet build TalepPazari.slnx --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:csharp"
